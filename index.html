<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blasscode · En remodelación</title>
    <meta name="description" content="El portfolio de Rafael Trujillo está en remodelación.">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpolygon points='50,5 95,25 95,75 50,95 5,75 5,25' fill='%231a1410' stroke='%23d4af37' stroke-width='6'/%3E%3C/svg%3E">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --color-bg: #1a1410;
            --color-bg-glow: #2e221a;
            --color-gold: #d4af37;
            --color-parchment: #fcf1d8;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2.5rem;
            padding: 1.5rem;
            background: radial-gradient(circle at 50% 45%, var(--color-bg-glow), var(--color-bg) 70%);
            color: var(--color-parchment);
            font-family: Georgia, 'Times New Roman', serif;
            text-align: center;
        }

        .dado {
            width: clamp(96px, 22vw, 150px);
            animation: flotar 3s ease-in-out infinite;
        }

        .dado svg {
            display: block;
            width: 100%;
            height: auto;
            stroke: var(--color-gold);
            stroke-width: 2;
            stroke-linejoin: round;
            fill: none;
            filter: drop-shadow(0 0 14px rgba(212, 175, 55, 0.35));
            animation: tirar 6s ease-in-out infinite;
        }

        .sombra {
            width: 60%;
            height: 10px;
            margin: 14px auto 0;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.55);
            filter: blur(4px);
            animation: sombra 3s ease-in-out infinite;
        }

        h1 {
            font-size: clamp(1.6rem, 6vw, 3rem);
            font-weight: normal;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }

        .puntos {
            display: flex;
            justify-content: center;
            gap: 0.6rem;
            margin-top: 1.25rem;
        }

        .puntos span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--color-gold);
            animation: pulso 1.4s ease-in-out infinite;
        }

        .puntos span:nth-child(2) { animation-delay: 0.2s; }
        .puntos span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes flotar {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-14px); }
        }

        @keyframes sombra {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(0.75); opacity: 0.5; }
        }

        /* El dado descansa y cada tanto se tira */
        @keyframes tirar {
            0%, 70% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes pulso {
            0%, 80%, 100% { opacity: 0.25; transform: scale(0.8); }
            40% { opacity: 1; transform: scale(1); }
        }

        @media (prefers-reduced-motion: reduce) {
            .dado,
            .dado svg,
            .sombra,
            .puntos span {
                animation: none;
            }
        }
    </style>
</head>
<body>
    <div class="dado" aria-hidden="true">
        <svg viewBox="0 0 100 100">
            <polygon points="50,5 95,25 95,75 50,95 5,75 5,25" fill="#2a1d17"/>
            <polygon points="50,5 50,45 5,25"/>
            <polygon points="50,5 95,25 50,45"/>
            <polygon points="5,25 50,45 25,80"/>
            <polygon points="95,25 50,45 75,80"/>
            <polygon points="50,45 25,80 75,80"/>
            <polygon points="25,80 75,80 50,95"/>
        </svg>
        <div class="sombra"></div>
    </div>

    <main>
        <h1>En Remodelación</h1>
        <div class="puntos" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </main>
</body>
</html>
